<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capital AI Chat Widget</title>
<style>
body{margin:0;background:#0d0d0d;min-height:100vh;}
.preview-note{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(192,57,43,0.15);border:0.5px solid rgba(192,57,43,0.4);color:#e8d5b0;font-size:12px;padding:8px 16px;border-radius:20px;z-index:9998;white-space:nowrap;font-family:system-ui,sans-serif;}
#cap-chat-widget *{box-sizing:border-box;margin:0;padding:0;}
#cap-btn{position:fixed;bottom:28px;right:28px;z-index:9999;width:56px;height:56px;border-radius:50%;background:#C0392B;border:none;cursor:pointer;box-shadow:0 4px 24px rgba(192,57,43,0.45);display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;animation:capPulse 3s 2s infinite;}
#cap-btn:hover{transform:scale(1.08);box-shadow:0 6px 32px rgba(192,57,43,0.6);}
#cap-btn svg{width:24px;height:24px;fill:white;transition:opacity .2s;}
#cap-btn .ico-close{display:none;}
@keyframes capPulse{0%,100%{box-shadow:0 4px 24px rgba(192,57,43,0.45);}50%{box-shadow:0 4px 32px rgba(192,57,43,0.75),0 0 0 8px rgba(192,57,43,0.1);}}
#cap-panel{position:fixed;bottom:104px;right:32px;z-index:9999;width:460px;background:#141414;border:0.5px solid rgba(255,255,255,0.1);border-radius:24px;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,0.75),0 0 0 0.5px rgba(192,57,43,0.2);transform:translateY(20px) scale(0.97);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
#cap-panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:all;}
.cap-hdr{padding:22px 24px;border-bottom:0.5px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:16px;border-radius:24px 24px 0 0;background:linear-gradient(135deg,rgba(192,57,43,0.12),transparent);flex-shrink:0;}
.cap-av{width:46px;height:46px;border-radius:50%;background:rgba(192,57,43,0.2);border:2px solid rgba(192,57,43,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cap-av svg{width:22px;height:22px;fill:#C0392B;}
.cap-hdr-name{font-size:16px;font-weight:600;color:#f0ece4;letter-spacing:-.01em;}
.cap-hdr-status{font-size:13px;color:#827e7a;display:flex;align-items:center;gap:6px;margin-top:4px;}
.cap-dot{width:7px;height:7px;border-radius:50%;background:#27ae60;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.cap-msgs{overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px;height:380px;scroll-behavior:smooth;}
.cap-msgs::-webkit-scrollbar{width:4px;}
.cap-msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.cap-msg{display:flex;gap:10px;animation:msgIn .3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cap-msg.user{flex-direction:row-reverse;}
.cap-bbl{max-width:78%;padding:14px 18px;border-radius:16px;font-size:15.5px;line-height:1.7;color:#f0ece4;}
.cap-msg.bot .cap-bbl{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.08);border-radius:4px 16px 16px 16px;}
.cap-msg.user .cap-bbl{background:#C0392B;border-radius:16px 4px 16px 16px;color:#fff;}
.cap-typing{display:flex;align-items:center;gap:5px;padding:14px 18px;}
.cap-typing span{width:7px;height:7px;border-radius:50%;background:#555;animation:dot 1.2s infinite;}
.cap-typing span:nth-child(2){animation-delay:.2s;}
.cap-typing span:nth-child(3){animation-delay:.4s;}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.cap-chips{padding:4px 24px 18px;display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0;}
.cap-chip{font-size:13.5px;color:#a09a90;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:8px 16px;cursor:pointer;transition:all .2s;font-family:inherit;}
.cap-chip:hover{color:#f0ece4;border-color:rgba(192,57,43,0.4);background:rgba(192,57,43,0.08);}
.cap-irow{padding:16px 18px;border-top:0.5px solid rgba(255,255,255,0.07);display:flex;gap:12px;align-items:flex-end;border-radius:0 0 24px 24px;flex-shrink:0;}
#cap-input{flex:1;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.12);border-radius:14px;padding:13px 16px;font-size:15px;color:#f0ece4;font-family:inherit;outline:none;resize:none;min-height:48px;max-height:120px;transition:border-color .2s;line-height:1.5;}
#cap-input::placeholder{color:#3a3530;}
#cap-input:focus{border-color:rgba(192,57,43,0.45);}
#cap-send{width:46px;height:46px;border-radius:13px;background:#C0392B;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;flex-shrink:0;}
#cap-send:hover{background:#962b1b;transform:scale(1.05);}
#cap-send:disabled{background:#222;cursor:not-allowed;transform:none;}
#cap-send svg{width:19px;height:19px;fill:white;}
.cap-footer{text-align:center;padding:10px 0 14px;font-size:11.5px;color:#3a3530;flex-shrink:0;}
@media(max-width:500px){#cap-panel{width:calc(100vw - 16px);right:8px;bottom:88px;border-radius:20px;}#cap-btn{right:16px;bottom:20px;}.cap-bbl{font-size:15px;}}
</style>
</head>
<body>
<div class="preview-note">Widget preview — click the red button bottom-right</div>
<div id="cap-chat-widget">
  <button id="cap-btn" aria-label="Chat with Capital AI">
    <svg class="ico-chat" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    <svg class="ico-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>
  <div id="cap-panel" role="dialog" aria-label="Capital AI Chat">
    <div class="cap-hdr">
      <div class="cap-av"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>
      <div><div class="cap-hdr-name">Capital AI Assistant</div><div class="cap-hdr-status"><span class="cap-dot"></span> AI SEO expert · Ottawa</div></div>
    </div>

    <div class="cap-msgs" id="cap-msgs"></div>
    <div class="cap-chips" id="cap-chips">
      <button class="cap-chip" onclick="capChip(this)">Am I invisible to AI search?</button>
      <button class="cap-chip" onclick="capChip(this)">How is AI killing traditional SEO?</button>
      <button class="cap-chip" onclick="capChip(this)">What does the free audit find?</button>
      <button class="cap-chip" onclick="capChip(this)">My site is bilingual — help</button>
    </div>
    <div class="cap-irow" id="cap-irow">
      <textarea id="cap-input" placeholder="Ask about AI SEO..." rows="1"></textarea>
      <button id="cap-send" disabled><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
    <div class="cap-footer" id="cap-footer">Powered by Capital AI · capitalai.ca</div>
  </div>
</div>
<script>
(function(){
const SYSTEM = `You are Capital AI Chat — Ottawa's leading AI-first SEO strategist, representing Capital AI, founded by Khalid (Khal) Mohamed.

Tone: confident, direct, authoritative, value-first. Max 4 sentences per response. No markdown, no bullet points, no headers. Plain sentences only.

Primary goal: book the free 15-min AI Visibility Audit. Use loss-framing. After 2-3 exchanges, push for booking. Always end every response with a question or audit offer.

When you decide to offer the Calendly booking link, end your message with the token [SHOW_CALENDLY] on its own line.

THE STRATEGIC REALITY (draw from this — never recite it as a list):
AI isn't changing SEO — it's replacing the entire customer journey. When someone asks ChatGPT or Google Overviews for a recommendation, the AI answer IS the decision. No website visit. No brand comparison. No second chance. Harvard Business Review found what used to take 15-20 website visits now happens in a single LLM response — and the brands that shaped those visits are erased entirely. 47% fewer clicks when AI summaries appear. Some publishers down 67-89% on their best pages. Optimized brands seeing 120-693% AI traffic growth (Semrush 2026). Brands ignoring this lose 25-67% of visibility by 2028.

The real problem: most Ottawa businesses are invisible to AI not because their SEO is broken — but because their content is generic and unquotable. AI cites the most authoritative answer, not the most optimized page. Schema on hollow content just polishes the problem.

What wins citations: original data, named frameworks, real expert bylines, consistent brand signals everywhere, clean entity coverage. For Ottawa/Gatineau: proper bilingual structure with hreflang and content parity — most bilingual sites are cannibalizing themselves.

The philosophy: to be cited by AI, you have to actually BE the best answer. Technical fixes amplify real expertise — they cannot replace it.

CASE STUDIES (use one when relevant, keep it to 1-2 sentences):
Ottawa dental client: invisible on Perplexity, Capital AI fixes, cited in 6 weeks, 240% traffic and 18 new patients from AI-driven searches.
Gatineau outdoor retailer: 47 duplicate-content issues and zero hreflang, rebuilt bilingual structure, top 3 in both languages, 180% traffic.
Ottawa consulting firm: zero AI Overview presence, schema and content fixes, appearing for 9 of 12 top keywords, 2 new government contracts.
Ottawa tech startup: page 3 to page 1 plus AI citations, leads doubled in one month.

ABOUT CAPITAL AI:
Ottawa's AI citation optimisation agency. Founded by Khalid (Khal) — ex-federal web developer, bilingual EN/FR. Services: AI citation optimisation, bilingual web builds, SEO and AI hybrid, full retainer. Free 15-min AI Visibility Audit — no pitch, no credit card. Phone: 613-854-0929. Email: hello@capitalai.ca. Serves Ottawa, Gatineau, NCR.

LOSS FRAMING (use sparingly, max once per conversation):
You are not losing rankings — you are being removed from the customer journey before prospects know you exist. Your competitors are being cited in AI answers right now. Every week you wait, that gap widens.

STRICT RULES:
Never fabricate metrics for their specific site. Never promise exact rankings or timelines. Never name local competitors. If off-topic, one sentence redirect then move on. Never more than 4 sentences. Ever.'`;

let open=false, msgs=[], busy=false;
const btn=document.getElementById('cap-btn'),
      panel=document.getElementById('cap-panel'),
      msgsEl=document.getElementById('cap-msgs'),
      input=document.getElementById('cap-input'),
      send=document.getElementById('cap-send'),
      chips=document.getElementById('cap-chips'),
      irow=document.getElementById('cap-irow'),
      footer=document.getElementById('cap-footer'),
      dummy=null;

btn.addEventListener('click',()=>{
  open=!open;
  panel.classList.toggle('open',open);
  btn.querySelector('.ico-chat').style.display=open?'none':'block';
  btn.querySelector('.ico-close').style.display=open?'block':'none';
  if(open&&msgs.length===0)welcome();
  if(open)setTimeout(()=>input.focus(),300);
});


function welcome(){addMsg('bot',"Most Ottawa businesses are invisible to AI search right now — and they have no idea. What's your site? Drop the URL and I'll tell you exactly where you stand.");}

async function sendMsg(text){
  if(!text.trim()||busy)return;
  chips.style.display='none';
  addMsg('user',text);
  msgs.push({role:'user',content:text});
  input.value='';input.style.height='auto';send.disabled=true;busy=true;
  const tid=showTyping();
  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,system:SYSTEM,messages:msgs})
    });
    removeTyping(tid);
    if(!res.ok){
      const e=await res.json();
      if(res.status===401){addMsg('bot','API key invalid. Refresh and re-enter a valid key.');localStorage.removeItem('cap_k');}
      else addMsg('bot','Something went wrong. Try again in a moment.');
      return;
    }
    const d=await res.json();
    const reply=d.content[0].text;
    msgs.push({role:'assistant',content:reply});
    const cleanReply = reply.replace('[SHOW_CALENDLY]','').trim();
    addMsg('bot', cleanReply);
    if(reply.includes('[SHOW_CALENDLY]')) showCalendly();
  }catch(e){removeTyping(tid);addMsg('bot','Network error — check your connection.');}
  finally{busy=false;send.disabled=false;input.focus();}
}

function showCalendly(){
  const wrap=document.createElement('div');
  wrap.className='cap-msg bot';
  wrap.innerHTML='<div class="cap-bbl" style="background:rgba(192,57,43,0.12);border:0.5px solid rgba(192,57,43,0.4);text-align:center;padding:16px 18px;">'+
    '<div style="font-size:13px;color:#e8d5b0;margin-bottom:12px;">Book your free 15-min AI Visibility Audit</div>'+
    '<a href="https://calendly.com/capitalai" target="_blank" rel="noopener" '+
    'style="display:inline-block;background:#C0392B;color:#fff;text-decoration:none;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:500;">'+
    'Book Audit →</a>'+
    '<div style="font-size:11px;color:#827e7a;margin-top:8px;">No pitch. No credit card.</div>'+
  '</div>';
  msgsEl.appendChild(wrap);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

function addMsg(role,text){
  const m=document.createElement('div');m.className='cap-msg '+role;
  const b=document.createElement('div');b.className='cap-bbl';b.textContent=text;
  m.appendChild(b);msgsEl.appendChild(m);msgsEl.scrollTop=msgsEl.scrollHeight;
}
function showTyping(){
  const id='t'+Date.now(),m=document.createElement('div');
  m.className='cap-msg bot';m.id=id;
  m.innerHTML='<div class="cap-bbl cap-typing"><span></span><span></span><span></span></div>';
  msgsEl.appendChild(m);msgsEl.scrollTop=msgsEl.scrollHeight;return id;
}
function removeTyping(id){const e=document.getElementById(id);if(e)e.remove();}

input.addEventListener('input',()=>{send.disabled=!input.value.trim();input.style.height='auto';input.style.height=Math.min(input.scrollHeight,100)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg(input.value);}});
send.addEventListener('click',()=>sendMsg(input.value));
window.capChip=el=>sendMsg(el.textContent);
})();
</script>
</body>
</html>
